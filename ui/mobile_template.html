<!DOCTYPE html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>원전 디지털 트윈 — 모바일 뷰어</title>
<style>
/* 모바일 뷰어 — 보고서 선택 → 전체 화면 3D + 하단 시트(사진) + 전체화면 확대 */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#14181d;
  font-family:'Malgun Gothic','Apple SD Gothic Neo',system-ui,sans-serif;color:#dfe6ec;
  overscroll-behavior:none;touch-action:none}

/* 첫 화면 — 보고서 파일 고르기 */
#pick{position:absolute;inset:0;z-index:100;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:14px;padding:28px;text-align:center;background:#14181d}
#pick h1{font-size:19px;font-weight:600;color:#e7edf3;letter-spacing:.2px}
#pick .sub{font-size:13px;color:#7d93a6;line-height:1.7}
#pick label{margin-top:6px;padding:15px 26px;border-radius:12px;background:#12b5cc;color:#04222a;
  font-size:16px;font-weight:700;border:none}
#pick input{display:none}
#pick .note{margin-top:10px;font-size:11.5px;color:#5d7284;line-height:1.65;max-width:320px}
#err{color:#ff8b7e;font-size:13px;line-height:1.6;max-width:320px;min-height:1em}

#boot{position:absolute;inset:0;display:none;flex-direction:column;gap:10px;
  align-items:center;justify-content:center;font-size:15px;color:#9ab;z-index:99;
  background:#14181d;text-align:center;padding:24px}
#bar{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;align-items:center;gap:8px;
  padding:calc(8px + env(safe-area-inset-top)) 12px 8px;
  background:linear-gradient(#14181dee,#14181d00);pointer-events:none}
#bar .t{font-size:14px;font-weight:600;color:#cfd8e0;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
#hintPill{position:fixed;left:50%;transform:translateX(-50%);z-index:10;
  bottom:calc(18px + env(safe-area-inset-bottom));padding:9px 16px;border-radius:20px;
  background:rgba(20,26,33,.82);border:1px solid #38424d;font-size:13px;color:#aebccb;
  transition:opacity .4s;pointer-events:none;white-space:nowrap}
#homeBtn{position:fixed;right:12px;z-index:10;width:40px;height:40px;border-radius:50%;
  top:calc(8px + env(safe-area-inset-top));
  background:rgba(20,26,33,.8);border:1px solid #38424d;color:#cfd8e0;font-size:17px}
#view3d{position:absolute;inset:0}
#view3d canvas{display:block}

/* 하단 시트 */
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:20;transform:translateY(105%);
  transition:transform .28s cubic-bezier(.3,.9,.3,1);
  background:#171c22;border-top:1px solid #2a3138;border-radius:16px 16px 0 0;
  padding:8px 12px calc(10px + env(safe-area-inset-bottom));max-height:62%;
  display:flex;flex-direction:column;gap:8px;touch-action:pan-y}
#sheet.open{transform:translateY(0)}
#sheetHead{display:flex;align-items:center;gap:8px;flex:none;padding-top:4px}
#pname{flex:1;font-size:12px;color:#9ab;font-family:ui-monospace,monospace;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#closeSheet{width:32px;height:32px;border-radius:8px;background:none;
  border:1px solid #3a4550;color:#cfd8e0;font-size:14px;flex:none}
#photoWrap{position:relative;align-self:center;line-height:0;max-width:100%;
  flex:0 1 auto;min-height:0;overflow:hidden;border-radius:8px}
#photo{max-width:100%;max-height:34vh;display:block;border-radius:8px}
#photoMark{position:absolute;transform:translate(-50%,-50%);border-radius:50%;
  background:rgba(255,64,48,.30);border:2px solid rgba(255,64,48,.78);pointer-events:none;display:none}
#photoTip{flex:none;text-align:center;font-size:11px;color:#64788a}
#alts{flex:none;display:flex;gap:6px;overflow-x:auto;padding:2px 0 4px;
  -webkit-overflow-scrolling:touch;touch-action:pan-x}
#alts .alt{position:relative;flex:none;width:74px;height:54px;border-radius:6px;overflow:hidden;
  border:2px solid transparent;background:#0e1319}
#alts .alt img{width:100%;height:100%;object-fit:cover;display:block}
#alts .alt.sel{border-color:#4aa8ff}
#alts .alt .dot{position:absolute;width:9px;height:9px;border-radius:50%;
  transform:translate(-50%,-50%);background:rgba(255,64,48,.6);
  border:1px solid rgba(255,64,48,.95);pointer-events:none}

/* 전체화면 확대 */
#full{position:fixed;inset:0;z-index:40;display:none;background:#0b0e11;touch-action:none}
#fullStage{position:absolute;left:0;top:0;transform-origin:0 0}
#fullImg{display:block;max-width:none;user-select:none;-webkit-user-drag:none}
#fullMark{position:absolute;transform:translate(-50%,-50%);border-radius:50%;
  background:rgba(255,64,48,.30);border:2px solid rgba(255,64,48,.78);pointer-events:none;display:none}
#fullClose{position:fixed;top:calc(10px + env(safe-area-inset-top));right:12px;z-index:41;
  width:40px;height:40px;border-radius:50%;background:rgba(20,26,33,.85);
  border:1px solid #38424d;color:#e7edf3;font-size:17px}
#fullTip{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom));left:50%;z-index:41;
  transform:translateX(-50%);font-size:11.5px;color:#8fa0ad;background:rgba(20,26,33,.7);
  padding:6px 12px;border-radius:14px;white-space:nowrap}
</style>
</head><body>

<div id="pick">
  <h1>원전 디지털 트윈 · 모바일 뷰어</h1>
  <div class="sub">보고서 파일(<b>.twin</b>)을 골라 주세요.<br>사진과 3D 모델은 그 파일 안에 들어 있습니다.</div>
  <label for="fileInput">보고서 파일 선택</label>
  <input type="file" id="fileInput">
  <div id="err"></div>
  <div class="note">이 뷰어 파일은 보고서와 상관없이 계속 재사용할 수 있습니다.
    다음부터는 <b>.twin</b> 파일만 받으면 됩니다.</div>
</div>

<div id="boot"><div id="bootMsg">여는 중…</div>
  <div style="font-size:12px;color:#64788a">네트워크 없이 폰 안에서 처리합니다</div></div>
<div id="bar"><span class="t" id="title"></span></div>
<button id="homeBtn" title="처음 시점" style="display:none">⌂</button>
<div id="view3d"></div>
<div id="hintPill" style="display:none">한 손가락 회전 · 두 손가락 확대/이동 · 표면을 탭하면 사진</div>

<div id="sheet">
  <div id="sheetHead"><span id="pname"></span><button id="closeSheet">✕</button></div>
  <div id="photoWrap"><img id="photo" alt=""><div id="photoMark"></div></div>
  <div id="photoTip">사진을 탭하면 크게 보기 · 붉은 원 = 탭한 지점</div>
  <div id="alts"></div>
</div>

<div id="full">
  <div id="fullStage"><img id="fullImg" alt=""><div id="fullMark"></div></div>
  <button id="fullClose">✕</button>
  <div id="fullTip">핀치: 확대 · 드래그: 이동 · 두 번 탭: 확대/원래대로</div>
</div>

<script type="text/plain" id="src-three">__THREE_SRC__</script>
<script type="text/plain" id="src-oc">__OC_SRC__</script>
<script type="text/plain" id="src-ply">__PLY_SRC__</script>
<script type="text/plain" id="src-bvh">__BVH_SRC__</script>
<script type="text/plain" id="src-lod">__LOD_SRC__</script>
<script type="text/plain" id="src-origin">__ORIGIN_SRC__</script>
<script type="text/plain" id="src-zip">__ZIP_SRC__</script>

<script type="module">
const $ = id => document.getElementById(id);
const say = m => { $('bootMsg').textContent = m; };
const grab = id => $(id).textContent.replaceAll('<\\/script', '</script');
// 안내 문구가 실제로 그려질 틈을 준다 — 뒤이어 오는 작업이 메인 스레드를 오래 잡는다.
const paint = () => new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));

// ---------- 엔진 (보고서와 무관하므로 미리 준비) ----------
const THREE = await import(URL.createObjectURL(new Blob([grab('src-three')], { type: 'text/javascript' })));
const OrbitControls = new Function('THREE', grab('src-oc') + '\nreturn OrbitControls;')(THREE);
const PLYLoader = new Function('THREE', grab('src-ply') + '\nreturn PLYLoader;')(THREE);
const buildBVH = new Function(grab('src-bvh') + '\nreturn buildBVH;')();
const buildLOD = new Function(grab('src-lod') + '\nreturn buildLOD;')();
const shiftToLocalOrigin = new Function(grab('src-origin') + '\nreturn shiftToLocalOrigin;')();
const openTwin = await (async () => {
  const src = grab('src-zip');
  const m = await import(URL.createObjectURL(new Blob([src], { type: 'text/javascript' })));
  return m.openTwin;
})();

// ---------- 보고서 고르기 ----------
$('fileInput').addEventListener('change', e => {
  const f = e.target.files && e.target.files[0];
  if (f) start(f);
});

let started = false;
async function start(file) {
  if (started) return;
  started = true;
  $('pick').style.display = 'none';
  $('boot').style.display = 'flex';
  try {
    await run(file);
  } catch (err) {
    // 실패하면 다시 고를 수 있게 첫 화면으로 되돌린다 — 막다른 길을 만들지 않는다.
    started = false;
    $('boot').style.display = 'none';
    $('pick').style.display = 'flex';
    $('err').textContent = '열 수 없습니다: ' + (err && err.message ? err.message : err);
    $('fileInput').value = '';
  }
}

async function run(file) {
  say('보고서 여는 중…');
  await paint();
  const twin = await openTwin(file);
  const DATA = await twin.json('meta.json');
  const cams = DATA.cameras || [];
  const name = (file.name || '보고서').replace(/\.twin$/i, '');
  $('title').textContent = name;
  document.title = name + ' — 모바일 뷰어';

  // ---------- 사진 — 실제로 볼 때만 디스크에서 읽는다 ----------
  // .twin 안 이미지는 무압축이라 slice 를 그대로 Blob 으로 감싼다(복사·디코드 없음).
  // URL 은 재사용을 위해 캐시한다. Blob 이 파일을 참조할 뿐이라 메모리를 차지하지 않는다.
  const urlCache = new Map();
  function imgName(id, kind) { return `img/${String(id).padStart(4, '0')}_${kind}.jpg`; }
  async function imgURL(id, kind) {
    const n = imgName(id, kind);
    if (urlCache.has(n)) return urlCache.get(n);
    if (!twin.has(n)) return null;
    const u = await twin.url(n, 'image/jpeg');
    urlCache.set(n, u);
    return u;
  }

  say('3D 모델 읽는 중…');
  await paint();
  const meshBuf = await twin.bytes('mesh.ply');
  say('3D 모델 푸는 중…');
  await paint();
  // 큰 절대좌표(UTM)를 국소좌표로 — float32 로 내려가기 전에 옮긴다(origin.js 머리말 참조).
  shiftToLocalOrigin(meshBuf, DATA);
  const geo = new PLYLoader().parse(meshBuf);

  // ---------- 3D 무대 ----------
  const view = $('view3d');
  const W = () => view.clientWidth, H = () => view.clientHeight;
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  const MAX_RATIO = Math.min(devicePixelRatio, 2);
  renderer.setPixelRatio(MAX_RATIO);
  renderer.setSize(W(), H());
  view.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x14181d);
  const camera = new THREE.PerspectiveCamera(60, W() / H(), 0.01, 1000);

  const hasColor = geo.hasAttribute('color');
  if (hasColor && geo.hasAttribute('normal')) geo.deleteAttribute('normal');
  const mat = hasColor ? new THREE.MeshBasicMaterial({ vertexColors: true })
                       : new THREE.MeshStandardMaterial({ color: 0x9aa4ad });
  if (!hasColor) {
    geo.computeVertexNormals();
    scene.add(new THREE.AmbientLight(0xffffff, 0.8));
    const dl = new THREE.DirectionalLight(0xffffff, 0.6);
    dl.position.set(1, 1, 2);
    scene.add(dl);
  }
  const mesh = new THREE.Mesh(geo, mat);
  scene.add(mesh);
  geo.computeBoundingSphere();
  geo.computeBoundingBox();
  const bs = geo.boundingSphere, bb = geo.boundingBox;

  camera.up.set(0, 0, 1);
  const HOME = bs.center.clone().add(new THREE.Vector3(0, -bs.radius * 2.2, bs.radius * 0.7));
  camera.position.copy(HOME);
  camera.near = bs.radius / 100;
  camera.far = bs.radius * 100;
  camera.updateProjectionMatrix();

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.target.copy(bs.center);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.update();
  $('homeBtn').style.display = '';
  $('homeBtn').addEventListener('click', () => {
    camera.position.copy(HOME);
    controls.target.copy(bs.center);
    controls.update();
  });

  const grid = new THREE.GridHelper(bb.getSize(new THREE.Vector3()).length() * 1.5, 40, 0x5a6672, 0x333c45);
  grid.rotation.x = Math.PI / 2;
  grid.position.set(bs.center.x, bs.center.y, bb.min.z);
  scene.add(grid);

  const MARKER_PX = 5;                             // 폰 화면 기준 표식 반지름(px)
  const marker = new THREE.Mesh(
    new THREE.SphereGeometry(1, 16, 16),
    new THREE.MeshBasicMaterial({ color: 0xff33cc, depthTest: false }));
  marker.renderOrder = 999;
  marker.visible = false;
  scene.add(marker);
  function sizeMarker() {
    if (!marker.visible) return;
    const dist = camera.position.distanceTo(marker.position);
    const wpp = 2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * dist / H();
    marker.scale.setScalar(Math.max(wpp * MARKER_PX, bs.radius * 1e-5));
  }

  // 탭 가속 구조 — 없으면 큰 메시에서 탭 한 번에 수십 초가 걸린다(bvh.js 머리말 참조).
  say('탭 가속 구조 준비 중…');
  await paint();
  const positions = geo.attributes.position.array;
  const BVH = buildBVH(positions, geo.index ? geo.index.array : null);

  // 조작 중에 쓸 간략 메시 — 폰에서 버벅이는 원인은 정점 수다(lod.js 머리말 참조).
  // 손을 대고 있는 동안만 이걸 그리고, 멈추면 원본으로 되돌리므로 화질 손해가 남지 않는다.
  say('부드러운 조작 준비 중…');
  await paint();
  let meshLod = null;
  if (geo.index) {
    const lod = buildLOD(positions, geo.index.array, bb, 700000);
    if (lod) {
      const g = new THREE.BufferGeometry();
      g.setAttribute('position', geo.attributes.position);   // 버퍼 공유 — 메모리 추가 없음
      if (hasColor) g.setAttribute('color', geo.attributes.color);
      g.setIndex(new THREE.BufferAttribute(lod.index, 1));
      g.boundingSphere = bs; g.boundingBox = bb;
      meshLod = new THREE.Mesh(g, mat);
      meshLod.visible = false;
      scene.add(meshLod);
    }
  }

  $('boot').style.display = 'none';
  $('hintPill').style.display = '';
  setTimeout(() => { $('hintPill').style.opacity = 0; }, 6000);

  // ---------- 사진 선택 (데스크톱 뷰어와 동일 로직: FOV 가드 + 가림 검사) ----------
  function projectToCam(cam, X) {
    const rx = X.x - cam.pos[0], ry = X.y - cam.pos[1], rz = X.z - cam.pos[2];
    const Zc = rx * cam.fwd[0] + ry * cam.fwd[1] + rz * cam.fwd[2];
    if (Zc <= 1e-6) return null;
    const Xc = rx * cam.right[0] + ry * cam.right[1] + rz * cam.right[2];
    const Yc = -(rx * cam.up[0] + ry * cam.up[1] + rz * cam.up[2]);
    const x = Xc / Zc, y = Yc / Zc;
    const r2 = x * x + y * y;
    // FOV 가드 — 화각 밖 점이 왜곡식에 접혀 들어와 유효한 척하는 것을 막는다.
    const rcx = Math.max(cam.cx, cam.w - cam.cx) / cam.fx;
    const rcy = Math.max(cam.cy, cam.h - cam.cy) / cam.fy;
    if (r2 > (rcx * rcx + rcy * rcy) * 1.10) return null;
    const d = (cam.dist || []).concat([0, 0, 0, 0, 0]).slice(0, 5);
    const rad = 1 + d[0] * r2 + d[1] * r2 * r2 + d[4] * r2 * r2 * r2;
    const xd = x * rad + 2 * d[2] * x * y + d[3] * (r2 + 2 * x * x);
    const yd = y * rad + d[2] * (r2 + 2 * y * y) + 2 * d[3] * x * y;
    const u = (cam.fx * xd + cam.cx) / cam.w, v = (cam.fy * yd + cam.cy) / cam.h;
    return (u < 0 || u > 1 || v < 0 || v > 1) ? null : { u, v };
  }

  function cameraCandidates(p, n) {
    const strict = [], loose = [];
    for (const c of cams) {
      const dx = c.pos[0] - p.x, dy = c.pos[1] - p.y, dz = c.pos[2] - p.z;
      const dist = Math.hypot(dx, dy, dz) || 1e-6;
      if (!projectToCam(c, p)) continue;
      const cos = n ? (n.x * dx + n.y * dy + n.z * dz) / dist : 1;
      const item = { cam: c, cos, dist, score: Math.max(cos, 0) / dist };
      loose.push(item);
      if (!(n && cos <= 0)) strict.push(item);
    }
    let list = strict.length ? strict : loose;
    if (!list.length)
      list = cams.map(c => {
        const dist = Math.hypot(c.pos[0] - p.x, c.pos[1] - p.y, c.pos[2] - p.z) || 1e-6;
        return { cam: c, cos: 0, dist, score: 1 / dist };
      });
    return list.sort((a, b) => b.score - a.score);
  }

  const _camPos = new THREE.Vector3(), _occDir = new THREE.Vector3();
  function cameraSeesPoint(cam, p) {
    _camPos.set(cam.pos[0], cam.pos[1], cam.pos[2]);
    _occDir.copy(p).sub(_camPos);
    const dist = _occDir.length();
    const tol = Math.max(dist * 0.01, bs.radius * 1.5e-3);
    if (dist <= tol) return true;
    _occDir.divideScalar(dist);
    return BVH.raycast(_camPos, _occDir, dist - tol, true) === null;   // 하나라도 막으면 가려짐
  }
  function pickVisibleCam(cands, p) {
    for (let i = 0; i < cands.length && i < 16; i++)
      if (cameraSeesPoint(cands[i].cam, p)) return cands[i].cam;
    return cands.length ? cands[0].cam : null;
  }

  // ---------- 하단 시트 ----------
  let lastPick = null;
  async function showPhoto(cam, p) {
    const img = $('photo'), mark = $('photoMark');
    lastPick = { cam, uv: p ? projectToCam(cam, p) : null };
    mark.style.display = 'none';
    img.onload = () => {
      if (!lastPick.uv) return;
      mark.style.left = (lastPick.uv.u * 100) + '%';
      mark.style.top = (lastPick.uv.v * 100) + '%';
      const d = Math.max(16, img.clientWidth * 0.09);
      mark.style.width = mark.style.height = d + 'px';
      mark.style.display = 'block';
    };
    const u = await imgURL(cam.id, 'full');
    if (u) img.src = u;
    $('pname').textContent = cam.source;
    for (const el of document.querySelectorAll('#alts .alt'))
      el.classList.toggle('sel', +el.dataset.id === cam.id);
    $('sheet').classList.add('open');
  }

  function renderAlts(cands, p) {
    const box = $('alts');
    box.innerHTML = '';
    const top = cands.slice(0, 12);
    if (top.length < 2) { box.style.display = 'none'; return; }
    for (const it of top) {
      const uv = p ? projectToCam(it.cam, p) : null;
      const el = document.createElement('div');
      el.className = 'alt';
      el.dataset.id = it.cam.id;
      const im = document.createElement('img');
      imgURL(it.cam.id, 'thumb').then(u => { if (u) im.src = u; });
      el.appendChild(im);
      if (uv) {
        const dot = document.createElement('div');
        dot.className = 'dot';
        dot.style.left = (uv.u * 100) + '%';
        dot.style.top = (uv.v * 100) + '%';
        el.appendChild(dot);
      }
      el.addEventListener('click', () => showPhoto(it.cam, p));
      box.appendChild(el);
    }
    box.style.display = 'flex';
  }

  // 시트는 ✕ 버튼으로만 닫는다 — 끌어내리는 제스처는 3D 조작과 헷갈려 쓰지 않는다.
  const sheetEl = $('sheet');
  function closeSheet() { sheetEl.classList.remove('open'); marker.visible = false; invalidate(); }
  $('closeSheet').addEventListener('click', closeSheet);

  // ---------- 탭 처리 ----------
  const ray = new THREE.Raycaster();
  // 면 번호 → 월드 법선. 메시에 변환을 걸지 않으므로 정점 좌표가 곧 월드 좌표다.
  const _fa = new THREE.Vector3(), _fb = new THREE.Vector3(), _fc = new THREE.Vector3();
  function faceNormal(tri) {
    const [ia, ib, ic] = BVH.faceVerts(tri);
    _fa.fromArray(positions, ia * 3); _fb.fromArray(positions, ib * 3); _fc.fromArray(positions, ic * 3);
    const n = _fb.sub(_fa).cross(_fc.sub(_fa));
    return n.lengthSq() > 0 ? n.normalize().clone() : null;
  }
  function pickAt(cx, cy) {
    const r = renderer.domElement.getBoundingClientRect();
    if (!r.width || !r.height) return;
    const mx = ((cx - r.left) / r.width) * 2 - 1;
    const my = -((cy - r.top) / r.height) * 2 + 1;
    ray.setFromCamera(new THREE.Vector2(mx, my), camera);
    const hit = BVH.raycast(ray.ray.origin, ray.ray.direction, Infinity, false);
    if (!hit) return;
    const p = ray.ray.at(hit.distance, new THREE.Vector3());
    const n = faceNormal(hit.triangle);
    if (n && n.dot(camera.position.clone().sub(p)) < 0) n.negate();
    marker.position.copy(p);
    marker.visible = true;
    invalidate();                              // 표식이 생겼으니 다시 그린다
    const cands = cameraCandidates(p, n);
    renderAlts(cands, p);
    const best = pickVisibleCam(cands, p);
    if (best) showPhoto(best, p);
  }

  let _dn = null, _dnCount = 0;
  renderer.domElement.addEventListener('pointerdown', e => {
    _dnCount++;
    _dn = _dnCount === 1 ? { x: e.clientX, y: e.clientY, t: performance.now() } : null;  // 멀티터치는 탭 아님
  });
  renderer.domElement.addEventListener('pointerup', e => {
    _dnCount = Math.max(0, _dnCount - 1);
    if (!_dn) return;
    const moved = Math.hypot(e.clientX - _dn.x, e.clientY - _dn.y);
    const held = performance.now() - _dn.t;
    _dn = null;
    if (moved > 8 || held > 450) return;
    pickAt(e.clientX, e.clientY);
  });
  renderer.domElement.addEventListener('pointercancel', () => { _dnCount = 0; _dn = null; });

  // ---------- 전체화면 확대 (핀치·드래그·더블탭) ----------
  const full = $('full'), stage = $('fullStage'), fimg = $('fullImg'), fmark = $('fullMark');
  let fv = { s: 1, tx: 0, ty: 0 }, fitS = 1;
  function applyFull() {
    stage.style.transform = `translate(${fv.tx}px,${fv.ty}px) scale(${fv.s})`;
    fmark.style.opacity = Math.max(0, Math.min(1, 1 - (fv.s / fitS - 1) / 2));
  }
  async function openFull() {
    if (!lastPick) return;
    fimg.onload = () => {
      const vw = innerWidth, vh = innerHeight;
      fitS = Math.min(vw / fimg.naturalWidth, vh / fimg.naturalHeight) * 0.99;
      fv = { s: fitS, tx: (vw - fimg.naturalWidth * fitS) / 2, ty: (vh - fimg.naturalHeight * fitS) / 2 };
      if (lastPick.uv) {
        const d = Math.max(30, fimg.naturalWidth * 0.05);
        fmark.style.width = fmark.style.height = d + 'px';
        fmark.style.left = (lastPick.uv.u * fimg.naturalWidth) + 'px';
        fmark.style.top = (lastPick.uv.v * fimg.naturalHeight) + 'px';
        fmark.style.display = 'block';
      } else fmark.style.display = 'none';
      applyFull();
    };
    const u = await imgURL(lastPick.cam.id, 'full');
    if (u) fimg.src = u;
    full.style.display = 'block';
  }
  $('photo').addEventListener('click', openFull);
  $('fullClose').addEventListener('click', () => { full.style.display = 'none'; });

  const ptrs = new Map();
  let pinch0 = null, lastTap = 0;
  full.addEventListener('pointerdown', e => {
    try { full.setPointerCapture(e.pointerId); } catch (_) {}
    ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (ptrs.size === 2) {
      const [a, b] = [...ptrs.values()];
      pinch0 = { d: Math.hypot(a.x - b.x, a.y - b.y), s: fv.s,
                 cx: (a.x + b.x) / 2, cy: (a.y + b.y) / 2, tx: fv.tx, ty: fv.ty };
    } else if (ptrs.size === 1) {
      const now = performance.now();
      if (now - lastTap < 300) {                     // 더블탭: 확대 ↔ 원래대로
        const target = fv.s > fitS * 1.5 ? fitS : fitS * 2.5;
        const k = target / fv.s;
        fv.tx = e.clientX - (e.clientX - fv.tx) * k;
        fv.ty = e.clientY - (e.clientY - fv.ty) * k;
        fv.s = target;
        applyFull();
      }
      lastTap = now;
    }
  });
  full.addEventListener('pointermove', e => {
    if (!ptrs.has(e.pointerId)) return;
    const prev = ptrs.get(e.pointerId);
    ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (ptrs.size === 2 && pinch0) {
      const [a, b] = [...ptrs.values()];
      const d = Math.hypot(a.x - b.x, a.y - b.y);
      const ns = Math.max(fitS * 0.5, Math.min(fitS * 40, pinch0.s * d / pinch0.d));
      const cx2 = (a.x + b.x) / 2, cy2 = (a.y + b.y) / 2;
      fv.tx = cx2 - (pinch0.cx - pinch0.tx) * (ns / pinch0.s);
      fv.ty = cy2 - (pinch0.cy - pinch0.ty) * (ns / pinch0.s);
      fv.s = ns;
      applyFull();
    } else if (ptrs.size === 1) {
      fv.tx += e.clientX - prev.x;
      fv.ty += e.clientY - prev.y;
      applyFull();
    }
  });
  const endPtr = e => { ptrs.delete(e.pointerId); if (ptrs.size < 2) pinch0 = null; };
  full.addEventListener('pointerup', endPtr);
  full.addEventListener('pointercancel', endPtr);

  // ---------- 루프 ----------
  // 조작 중에는 간략 메시로, 손을 떼면 원본으로 그린다. 그리고 달라진 게 없으면 아예 그리지
  // 않는다 — 폰에서 계속 그리면 발열로 성능이 더 떨어진다.
  let _idle = 999, _needsRender = true;
  const IDLE_SEC = 0.25;                       // 이 시간 동안 조용하면 원본으로 되돌린다

  function setDetail(useLod) {
    if (!meshLod) return;
    const wantLod = useLod;
    if (meshLod.visible === wantLod) return;
    meshLod.visible = wantLod;
    mesh.visible = !wantLod;
    _needsRender = true;
  }
  const invalidate = () => { _needsRender = true; };
  addEventListener('resize', () => {
    camera.aspect = W() / H();
    camera.updateProjectionMatrix();
    renderer.setSize(W(), H());
    invalidate();
  });
  controls.addEventListener('change', () => { _idle = 0; invalidate(); });

  const _clock = new THREE.Clock();
  (function loop() {
    requestAnimationFrame(loop);
    _idle += Math.min(_clock.getDelta(), 0.25);
    setDetail(_idle < IDLE_SEC);               // 조작 중이면 간략 메시
    controls.update();                         // 감쇠가 끊기지 않게 항상 갱신 — 바뀌면 change 로 알려온다
    if (!_needsRender) return;                 // 변화가 없으면 GPU 를 쉬게 둔다(발열·배터리)
    _needsRender = false;
    sizeMarker();
    renderer.render(scene, camera);
  })();
}
</script>
</body></html>
