<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>디지털 트윈 스튜디오</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <strong>🏭 디지털 트윈 스튜디오</strong>
  <span class="sub">이미지 분석 → 보고서(.twin) 생성 · 여러 보고서를 각각의 창으로 열기</span>
  <button id="btnQuit" class="danger" title="프로그램을 종료합니다 (확인 후 종료)">⏻ 종료</button>
</header>

<main>
  <!-- 기능 1: 보고서 만들기 -->
  <section class="card">
    <h2>① 보고서 만들기</h2>
    <p class="desc">이미지+XMP 폴더와 3D 메시(PLY)를 <b>best.pt로 크랙 검출</b>·3D 역투영해 자체완결형 보고서를 생성합니다.</p>
    <div class="row"><button id="btnFolder">📁 이미지+XMP 폴더</button><span id="folderLbl" class="lbl">선택 안 됨</span></div>
    <div class="row"><button id="btnPly">🧩 PLY 메시</button><span id="plyLbl" class="lbl">선택 안 됨</span></div>
    <div class="row nmrow">
      <label for="reportName">보고서 이름</label>
      <input type="text" id="reportName" placeholder="예: 격납건물_1층 (비우면 폴더명 사용)" spellcheck="false">
      <span class="ext">.twin</span>
    </div>
    <label class="ck"><input type="checkbox" id="ckOcr" checked> 크랙 검출(best.pt) 수행</label>
    <button id="btnCreate" class="primary" disabled>분석 시작 → 보고서 생성</button>
    <div id="prog" class="prog hidden"><div id="progBar"></div></div>
    <pre id="log" class="log hidden"></pre>
  </section>

  <!-- 기능 2: 보고서 열기 -->
  <section class="card">
    <h2>② 보고서 열기 <span class="hint">(각각 새 창 · 동시에 여러 개)</span></h2>
    <div class="row">
      <button id="btnOpenFile" class="primary">📂 보고서 파일(.twin) 열기</button>
      <button id="btnRefresh">↻ 목록 새로고침</button>
    </div>
    <div id="reportList" class="rlist"></div>
  </section>
</main>

<script src="/dashboard.js"></script>
</body>
</html>
