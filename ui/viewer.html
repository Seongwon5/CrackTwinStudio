<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>3D 뷰어 — 원본 소스</title>
<link rel="stylesheet" href="/viewer.css">
</head><body>
<div id="boot">보고서 여는 중…</div>
<div id="wrap" style="display:none">
  <div id="view3d"><div id="gizmo" title="축 클릭 = 그 방향에서 보기"></div></div>
  <div id="side">
    <div id="hint"><b>W A S D</b>: 이동 · <b>Space / Ctrl</b>: 위아래 · <b>Shift</b>: 가속<br>
      좌드래그: 시점 회전 · 휠: 전진·후진 · 우클릭 홀드: 확대<br><br>
      구조물 표면을 <b>클릭</b>하면 그 지점을 찍은<br>가장 가까운 사진이 여기에 표시됩니다.</div>
    <div id="photoWrap">
      <img id="photo" alt="" title="우클릭: 자세히 보기">
      <div id="photoMark"></div>
    </div>
    <div id="pname"></div>
    <div id="alts" title="같은 지점을 찍은 다른 사진 — 클릭하면 위 이미지와 교체됩니다"></div>
  </div>
</div>
<!-- 우클릭 컨텍스트 메뉴 (바탕화면 우클릭처럼) -->
<div id="ctx"><div class="ctxitem" id="ctxDetail">자세히 보기</div></div>
<!-- 이미지 자세히 보기 — 메인 창 '안'의 모달. 휠: 커서 위치 확대 · 드래그: 이동 · Esc/✕: 닫기 -->
<div id="imgmodal">
  <div id="imBar"><span id="imTitle"></span><button id="imClose" title="닫기 (Esc)">✕</button></div>
  <div id="imView">
    <div id="imStage">
      <img id="imImg" alt="">
      <div id="imMark"></div>
    </div>
  </div>
</div>
<script type="importmap">
{"imports":{"three":"/libs/three.module.js",
"three/addons/":"/libs/addons/"}}
</script>
<script>window.__VIEWER_REPORT__ = __REPORT__;</script>
<script type="module" src="/viewer.js"></script>
</body></html>
